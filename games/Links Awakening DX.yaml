Links Awakening DX:
  logic:
    normal: 1
  tradequest:
    false: 1
    true: 1
  goal:
    instruments: 5
    seashells: 3
  instrument_count:
    random-range-4-8: 1
  trendy_game:
    easy: 2
    normal: 5
    hard: 2

  # Base value, will be overwritten by keysanity_trigger if it rolls differently
  shuffle_nightmare_keys: original_dungeon
  shuffle_small_keys: original_dungeon

  # Trigger to roll nightmare and small keys together so keysanity is consistent for the slot
  keysanity_trigger:
    original_dungeon: 5
    own_dungeons: 1
    own_world: 1
    any_world: 8

  shuffle_maps: any_world
  shuffle_compasses: any_world
  shuffle_stone_beaks: any_world
  warps: improved_additional
  shuffle_instruments:
    original_dungeon: 10
    own_dungeons: 10
    own_world: 10
    any_world: 5
    vanilla: 50
  rooster:
    false: 1
    true: 1
  experimental_dungeon_shuffle:
    false: 3
    true: 2
  experimental_entrance_shuffle:
    none: 3
    simple: 1
  boots_controls:
    bracelet: 1
  music:
    vanilla: 10
    shuffled: 1
  stealing:
    in_logic: 3
    out_of_logic: 3
    disabled: 2
  overworld:
    normal: 1
    open_mabe: 3
  stabilize_item_pool:
    false: 1
    true: 1
  quickswap: b
  foreign_item_icons:
    guess_by_name: 1
    indicate_progression: 3
  tarins_gift: bush_breaker
  triggers:
    - option_category: Links Awakening DX
      option_name: goal
      option_result: seashells
      options:
        Links Awakening DX:
          local_items:
            - Seashell
    - option_category: Links Awakening DX
      option_name: keysanity_trigger
      option_result: own_dungeons
      options:
        Links Awakening DX:
          shuffle_nightmare_keys: own_dungeons
          shuffle_small_keys: own_dungeons
    - option_category: Links Awakening DX
      option_name: keysanity_trigger
      option_result: own_world
      options:
        Links Awakening DX:
          shuffle_nightmare_keys: own_world
          shuffle_small_keys: own_world
    - option_category: Links Awakening DX
      option_name: keysanity_trigger
      option_result: any_world
      options:
        Links Awakening DX:
          shuffle_nightmare_keys: any_world
          shuffle_small_keys: any_world
    - option_category: null
      option_name: name
      option_result: Player{player}
      options:
        null:
          name: LADX-{player}

