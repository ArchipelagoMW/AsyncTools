    - {option_category: Pokemon Crystal, option_name: goal_rolls_elite_four, option_result: include, options: {Pokemon Crystal: {+goal: ["Elite Four"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_rolls_red, option_result: include, options: {Pokemon Crystal: {+goal: ["Red"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_rolls_diploma, option_result: include, options: {Pokemon Crystal: {+goal: ["Diploma"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_rolls_rival, option_result: include, options: {Pokemon Crystal: {+goal: ["Rival"]}}}
