    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: elite_four, options: {Pokemon Crystal: {goal: ["Elite Four"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: red, options: {Pokemon Crystal: {goal: ["Red"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: diploma, options: {Pokemon Crystal: {goal: ["Diploma"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: rival, options: {Pokemon Crystal: {goal: ["Rival"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: defeat_team_rocket, options: {Pokemon Crystal: {goal: ["Defeat Team Rocket"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: unown_hunt, options: {Pokemon Crystal: {goal: ["Unown Hunt"]}}}
    - {option_category: Pokemon Crystal, option_name: goal_one_pick, option_result: battle_tower, options: {Pokemon Crystal: {goal: ["Battle Tower"]}}}

