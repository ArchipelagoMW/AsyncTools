    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_dungeon_interior, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Dungeon Interior"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_gym, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Gym"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_gym_interior, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Gym Interior"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_mart, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Mart"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_mart_interior, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Mart Interior"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_building, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Building"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_building_interior, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Building Interior"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_gate, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Gate"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_pokecenter, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Pokecenter"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_elevator, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Elevator"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_pokemon_league, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["Pokemon League"]}}}
    - {option_category: Pokemon Crystal, option_name: randomize_entrances_rolls_one_way, option_result: include, options: {Pokemon Crystal: {+randomize_entrances: ["One-Way"]}}}

    ## Triggers for ``entrance_selection``
    - {option_category: Pokemon Crystal, option_name: entrance_selection, option_result: all, options: {Pokemon Crystal: {randomize_entrances: ["_All"]}}}
    - {option_category: Pokemon Crystal, option_name: entrance_selection, option_result: none, options: {Pokemon Crystal: {randomize_entrances: []}}}
    - {option_category: Pokemon Crystal, option_name: entrance_selection, option_result: all_interior, options: {Pokemon Crystal: {randomize_entrances: ["Dungeon Interior", "Gym Interior", "Mart Interior", "Elevator", "Building Interior"]}}}
