  - [[ghetsis, champion, cynthia, seven_sages_hunt, legendary_hunt], [ghetsis, null], [champion, null], [cynthia, null], [seven_sages_hunt, null], [legendary_hunt, null]]
  - [[ghetsis, cobalion, cynthia], [ghetsis, null], [cobalion, null], [cynthia, null]]
  - [[ghetsis, seven_sages_hunt, legendary_hunt], [ghetsis, null], [seven_sages_hunt, null], [legendary_hunt, null]]

