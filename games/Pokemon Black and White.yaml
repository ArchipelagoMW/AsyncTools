Pokemon Black and White:
  # This game has a lot of custom handling for most of the options.
  # Everything in here has to be written exactly that way.
  # See https://github.com/SparkyDaDoggo/Archipelago/blob/main/worlds/pokemon_bw/docs/options%20guides.md for more information.

  version: dynamic

  goal:
