  reusable_tms:
    'on': 10
    yes_please: 10
    of_course: 10
    im_not_a_masochist: 10

  start_inventory:
    Parcel: 1

  triggers:
    - option_category: Pokemon Black and White
      option_name: t_randomize_wild_pokemon
      option_result: vanilla
      options:
        Pokemon Black and White:
          randomize_wild_pokemon: []
          modify_encounter_rates: try_normalized

    - option_category: Pokemon Black and White
      option_name: t_randomize_trainer_pokemon
      option_result: vanilla
      options:
        Pokemon Black and White:
          randomize_trainer_pokemon: []

    - option_category: Pokemon Black and White
      option_name: t_randomize_catch_rates
      option_result: shuffle
      options:
        Pokemon Black and White:
          +randomize_catch_rates:
            - 'Shuffle'
    - option_category: Pokemon Black and White
      option_name: t_randomize_catch_rates
      option_result: pidgey
      options:
        Pokemon Black and White:
          +randomize_catch_rates:
            - 'Randomize'
          stats_randomization_adjustments:
            Catch rates maximum: 255
            Catch rates minimum: 255
            Level up evo weight: 10
            Levelup moves amount maximum: 15
            Levelup moves amount minimum: 10
            Maximum evo level: 100
            Stats total maximum: 800
            Stats total minimum: 200

    - option_category: Pokemon Black and White
      option_name: t_pokemon_sanities
      option_result: dexsanity
      options:
        Pokemon Black and White:
          dexsanity: random-range-0-150
    - option_category: Pokemon Black and White
      option_name: t_pokemon_sanities
      option_result: seensanity
      options:
        Pokemon Black and White:
          seensanity: random-range-0-200
          formsanity:
            0: 20
            random-range-0-72: 10
    - option_category: Pokemon Black and White
      option_name: t_pokemon_sanities
      option_result: shinysanity
      options:
        Pokemon Black and White:
          shinysanity: random-range-0-50
    - option_category: Pokemon Black and White
      option_name: t_pokemon_sanities
      option_result: dexcountsanity
      options:
        Pokemon Black and White:
          dexcountsanity:
            Leniency: random-range-0-10
            Maximum: random-range-0-200
            Steps: random-range-2-5
    - option_category: Pokemon Black and White
      option_name: t_pokemon_sanities
      option_result: mixedsanity
      options:
        Pokemon Black and White:
          dexsanity: random-range-0-40
          seensanity: random-range-0-50
          shinysanity: random-range-0-10
          dexcountsanity:
            Leniency: random-range-0-10
            Maximum: random-range-0-50
            Steps: random-range-1-2
          formsanity: random-range-0-10

    - option_category: Pokemon Black and White
      option_name: version
      option_result: dynamic
      options:
        null:
          name: PokeBW-{player}
